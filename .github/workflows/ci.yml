name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    env:
      # Keep the worktree fixtures away from runner-level git config, which
      # otherwise perturbs init.defaultBranch and core.autocrlf on Windows.
      # RUNNER_TEMP is an environment variable, unlike the runner.* context,
      # which is not resolvable in a job-level env block.
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Prepare isolated git config
        shell: bash
        run: |
          echo "GIT_CONFIG_GLOBAL=$RUNNER_TEMP/agentclean-gitconfig" >> "$GITHUB_ENV"
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/agentclean-gitconfig"
          : > "$GIT_CONFIG_GLOBAL"
          git config --global user.email ci@example.invalid
          git config --global user.name "AgentClean CI"
          git config --global init.defaultBranch main
          git config --global protocol.file.allow always

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run pack:check

      # The test script used to be a shell glob, which cmd.exe does not expand,
      # so this leg would have been green while running nothing. Assert a
      # non-zero test count so that failure mode cannot come back.
      - name: Assert tests actually ran
        shell: bash
        run: |
          # tr -d '\r' matters: on Windows the TAP line arrives as "# tests 222\r",
          # so awk yields "222\r" and the numeric comparison below fails on a
          # run where every test actually passed.
          count=$(node scripts/run-tests.mjs 2>&1 | tr -d '\r' | grep -E '^# tests ' | awk '{print $3}')
          echo "test count: ${count:-0}"
          test "${count:-0}" -gt 0
